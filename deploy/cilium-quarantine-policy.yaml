apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ztre-quarantine-policy
spec:
  description: "ZTRE Automated Zero-Trust Quarantine: Explicitly denies all ingress and egress traffic for pods labeled with ztre/quarantine=true"
  endpointSelector:
    matchLabels:
      ztre/quarantine: "true"
  ingressDeny:
  - fromEntities:
    - all
  egressDeny:
  - toEntities:
    - all
