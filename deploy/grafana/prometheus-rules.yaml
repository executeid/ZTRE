apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  ztre-alerts.yaml: |
    groups:
    - name: ztre-security
      rules:
      - alert: ZTREContainmentTriggered
        expr: rate(ztre_containment_actions_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "ZTRE auto-containment triggered"
          description: "Active threat detected and pod quarantined. Check ztre-system agent logs."

      - alert: ZTREHighAnomalousRate
        expr: rate(ztre_events_classified_total{status="ANOMALOUS"}[5m]) > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Elevated anomalous process execution rate"
          description: "More than 0.5 anomalous events/sec over 5 minutes. Possible ongoing attack."

      - alert: ZTREAPIErrors
        expr: rate(ztre_api_errors_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "ZTRE Kubernetes API errors"
          description: "Containment executor encountering API errors. Quarantine may be delayed."

      - alert: ZTREEventDrops
        expr: rate(ztre_events_dropped_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "ZTRE dropping events due to buffer overflow"
          description: "Event ingestion rate exceeds processing capacity. Consider scaling workers."

      - alert: ZTREAgentHighMemory
        expr: container_memory_rss{container="ztre-agent"} > 100 * 1024 * 1024
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ZTRE agent memory usage exceeding 100MB"
          description: "Agent RSS approaching 128MB PRD limit. Investigate potential memory leak."
