apiVersion: v1
kind: ServiceAccount
metadata:
  name: ztre-agent
  namespace: ztre-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ztre-agent-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ztre-agent-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ztre-agent-role
subjects:
- kind: ServiceAccount
  name: ztre-agent
  namespace: ztre-system
