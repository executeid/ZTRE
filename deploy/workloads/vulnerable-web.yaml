apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-web
  namespace: ztre-test
  labels:
    app: vulnerable-web
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerable-web
  template:
    metadata:
      labels:
        app: vulnerable-web
        tier: frontend
    spec:
      containers:
      - name: web
        image: ztre-vulnerable-web:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 20m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: vulnerable-web
  namespace: ztre-test
spec:
  type: NodePort
  selector:
    app: vulnerable-web
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
